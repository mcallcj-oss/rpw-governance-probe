name: Probe governance publisher
on:
  workflow_run:
    workflows: ["Probe candidate validation"]
    types: [completed]
permissions:
  checks: write
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the gate result for the exact candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONC: ${{ github.event.workflow_run.conclusion }}
          WPATH: ${{ github.event.workflow_run.path }}
          WBRANCH: ${{ github.event.workflow_run.head_branch }}
          WEVENT: ${{ github.event.workflow_run.event }}
          REPO: ${{ github.repository }}
        run: |
          echo "sha=$SHA conclusion=$CONC path=$WPATH branch=$WBRANCH event=$WEVENT"
          test "$CONC" = "success"
          test "$WPATH" = ".github/workflows/heavy.yml"
          test "$WBRANCH" = "candidate"
          test "$WEVENT" = "push"
          gh api -X POST "repos/$REPO/check-runs" \
            -f name='Probe candidate gate' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Candidate validation passed' \
            -f "output[summary]=Published by the trusted publisher from main for $SHA"
